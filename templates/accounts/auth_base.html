{% load static %}<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %} · CustomerTrend AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-full bg-slate-50 text-slate-800 antialiased">
  <div class="flex min-h-screen flex-col items-center justify-center px-4 py-10">
    <a href="/" class="mb-8 flex items-center gap-3">
      <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-navy-900 text-sm font-bold text-white">CT</span>
      <span class="text-lg font-semibold text-slate-900">CustomerTrend <span class="text-brand-600">AI</span></span>
    </a>
    <div class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
      {% include "partials/messages.html" %}
      <h1 class="text-xl font-semibold text-slate-900">{% block heading %}{% endblock %}</h1>
      {% block content %}{% endblock %}
    </div>
    {% block below %}{% endblock %}
  </div>
  <script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
