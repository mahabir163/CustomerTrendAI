{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-lg rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
  <h2 class="text-lg font-semibold text-slate-900">Change password</h2>
  <form method="post" class="mt-6 space-y-5" novalidate>
    {% csrf_token %}
    {% for field in form %}{% include "partials/form_field.html" %}{% endfor %}
    <button type="submit" class="rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-brand-700">Update password</button>
  </form>
</div>
{% endblock %}
