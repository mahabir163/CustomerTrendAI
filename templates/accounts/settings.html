{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-2xl space-y-6">
  <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <h2 class="text-base font-semibold text-slate-900">Account</h2>
    <dl class="mt-4 grid grid-cols-3 gap-y-3 text-sm">
      <dt class="text-slate-500">Username</dt><dd class="col-span-2 text-slate-900">{{ request.user.username }}</dd>
      <dt class="text-slate-500">Email</dt><dd class="col-span-2 text-slate-900">{{ request.user.email }}</dd>
      <dt class="text-slate-500">Member since</dt><dd class="col-span-2 text-slate-900">{{ request.user.date_joined|date:"j M Y" }}</dd>
    </dl>
    <a href="{% url 'accounts:password_change' %}" class="mt-6 inline-flex rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Change password</a>
  </section>
  <section class="rounded-xl border border-dashed border-slate-300 bg-white/60 p-6 text-sm text-slate-600">
    Analysis preferences (such as RFM thresholds) will appear here in Phase 4.
  </section>
</div>
{% endblock %}
